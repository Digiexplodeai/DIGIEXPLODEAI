    <!-- Theme: Persistent Light / Dark Mode support (Default: Dark) -->
    <script>
      (function() {
        try {
          const v2 = localStorage.getItem('digi_agency_theme_v2');
          let effectiveTheme = v2;
          if (!effectiveTheme) {
            // First time or migrating from old default: default to dark
            effectiveTheme = 'dark';
            localStorage.setItem('digi_agency_theme_v2', 'dark');
            localStorage.setItem('digi_agency_theme', 'dark');
            localStorage.setItem('theme', 'dark');
          }

          if (effectiveTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (effectiveTheme === 'system') {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-theme', 'dark');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.setAttribute('data-theme', 'light');
            }
          } else {
            // dark by default
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
